name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-3d.yml'
      - 'scripts/update-stats.py'

permissions: {}

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Refresh public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update-stats.py
      - name: Generate real 3D contribution history
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ['assets/header.svg', 'assets/stats.svg', 'assets/languages.svg', 'profile-3d-contrib/profile-night-green.svg']:
              path = Path(name)
              assert path.stat().st_size > 0, name
              assert ET.parse(path).getroot().tag == '{http://www.w3.org/2000/svg}svg', name
              print('Valid SVG:', name)
          PY
      - name: Commit generated visuals only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/languages.svg assets/stats.json profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public profile statistics and contribution graph'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
